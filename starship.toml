"$schema" = 'https://starship.rs/config-schema.json'

# Icons: https://www.nerdfonts.com/cheat-sheet
# ░▒▓   ▓▒░   

format = """
[░▒▓](color_black2)\
$os\
$time\
[](fg:color_black2 bg:color_green)\
$hostname\
[](fg:color_green bg:color_blue2)\
$username\
[](fg:color_blue2 bg:color_yellow)\
$shell\
[](fg:color_yellow bg:color_red)\
$git_branch\
$git_status\
$docker_context\
[](fg:color_red bg:color_white3)\
$directory\
[](fg:color_white3)\
$line_break$character """
 
add_newline = true

palette = 'arch_os'

# Nord: https://www.nordtheme.com
[palettes.arch_os]
color_fg = '#d8dee9'
color_bg = '#2e3440'
color_red = '#bf616a'
color_green = '#a3be8c'
color_purple = '#b48ead'
color_yellow = '#ebcb8b'
color_orange = '#d08770'
color_white1 = '#eceff4'
color_white2 = '#e5e9f0'
color_white3 = '#d8dee9'
color_black1 = '#2e3440'
color_black2 = '#3b4252'
color_black3 = '#434c5e'
color_black4 = '#4c566a'
color_blue1 = '#5e81ac'
color_blue2 = '#81a1c1'
color_blue3 = '#88c0d0'
color_blue4 = '#8fbcbb'


# ----------------------------
# Enable: Remove line 7 (░▒▓) at start of format and trailing whitespace at the end (line 23)

[line_break]
#disabled = false # Enabled
disabled = true # Disabled

[character]
#disabled = false # Enabled
disabled = true # Disabled
success_symbol = '[ :](bold fg:color_green)' 
error_symbol = '[ :](bold fg:color_red)'
vimcmd_symbol = '[  ](bold fg:color_green)'
vimcmd_replace_one_symbol = '[  ](bold fg:color_purple)'
vimcmd_replace_symbol = '[  ](bold fg:color_purple)'
vimcmd_visual_symbol = '[  ](bold fg:color_yellow)'

# ----------------------------

[os]
disabled = false
style = "fg:color_white3 bg:color_black2"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = ""

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:color_black2"
format = '[[   $time ](fg:color_white3 bg:color_black2)]($style)'

[hostname]
ssh_only = true
ssh_symbol =  " 󱘖 " # 󱘖    󰣀
style = "fg:color_bg bg:color_green"
format = '[$ssh_symbol]($style)[   $hostname ]($style)'

[username]
show_always = false
style_user = "fg:color_bg bg:color_blue2"
style_root = "fg:color_red bg:color_blue2"
format = '[  ]($style)[ $user ](fg:color_bg bg:color_blue2)'
 
[shell]
disabled = false
fish_indicator = ""
bash_indicator = " 󰆍  bash "
unknown_indicator = " 󰆍  shell "
style = "fg:color_bg bg:color_yellow"
format = "[$indicator]($style)"

[directory]
disabled = false
truncation_length = 3
truncation_symbol = "…/"
style = "fg:color_bg bg:color_white3"
format = "[  $path ]($style)"

[directory.substitutions]
"~" = "  "

[git_branch]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol $branch ](fg:color_fg bg:color_red)]($style)'

[git_status]
style = "bg:color_red"
format = '[[($all_status$ahead_behind )](fg:color_fg bg:color_red)]($style)'

[docker_context]
symbol = ""
style = "bg:color_red"
format = '[[ $symbol( $context) ](fg:color_fg bg:color_red)]($style)'
